<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background:var(--primary)">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-user-graduate me-2"></i>Student Portal</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container py-4">
    <h3 class="mb-4" id="welcome">Welcome</h3>
    <div class="row g-4">
      <div class="col-md-4"><div class="stat-card"><div class="icon-box blue"><i class="fas fa-user"></i></div><div><h5 id="sName">-</h5><p>Profile</p></div></div></div>
      <div class="col-md-4"><div class="stat-card"><div class="icon-box green"><i class="fas fa-calendar-check"></i></div><div><h5>View</h5><p>Attendance</p></div></div></div>
      <div class="col-md-4"><div class="stat-card"><div class="icon-box orange"><i class="fas fa-file-alt"></i></div><div><h5>View</h5><p>Results</p></div></div></div>
    </div>
    <div class="form-card mt-4">
      <h5>My Profile</h5>
      <div id="profileInfo"></div>
    </div>
    <div class="form-card mt-4">
      <h5>Notices</h5>
      <div id="noticesList"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const session = checkAuth(['student']);
    if (!session) location.href = 'login.html';
    document.getElementById('welcome').textContent = 'Welcome, ' + session.name;
    const students = JSON.parse(localStorage.getItem('students') || '[]');
    const stu = students.find(s => s.id === session.studentId) || {};
    document.getElementById('sName').textContent = stu.name || session.name;
    document.getElementById('profileInfo').innerHTML = `
      <p><strong>ID:</strong> ${stu.id || '-'} | <strong>Class:</strong> ${stu.class || '-'} | <strong>Section:</strong> ${stu.section || '-'} | <strong>Roll:</strong> ${stu.rollNo || '-'}</p>
      <p><strong>Father:</strong> ${stu.fatherName || '-'} | <strong>Phone:</strong> ${stu.phone || '-'}</p>`;
    const notices = JSON.parse(localStorage.getItem('notices') || '[]').filter(n => n.published);
    document.getElementById('noticesList').innerHTML = notices.map(n => `<div class="mb-2"><strong>${n.title}</strong> <small class="text-muted">(${formatDate(n.date)})</small><br>${n.content}</div>`).join('') || 'No notices';
  </script>
</body>
</html>
