</head>
<body>

      <a class="navbar-brand" href="index.html"><i class="fas fa-graduation-cap fa-lg text-warning"></i> Shokat Ali Public School</a>

          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="admissions.html">Admissions</a></li>
          <li class="nav-item"><a class="nav-link" href="academics.html">Academics</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Login</a>

        </ul>
      </div>
    </div>
  </nav>

  <section class="hero" style="padding: 60px 0;">
    <div class="container text-center">
      <h1>School Gallery</h1>
      <p class="mb-0">Explore our campus, events and activities</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="text-center mb-4">
        <div class="btn-group" role="group">
          <button class="btn btn-outline-primary active" onclick="filterGallery('all')">All</button>
          <button class="btn btn-outline-primary" onclick="filterGallery('Building')">Building</button>
          <button class="btn btn-outline-primary" onclick="filterGallery('Classroom')">Classroom</button>
          <button class="btn btn-outline-primary" onclick="filterGallery('Sports')">Sports</button>
          <button class="btn btn-outline-primary" onclick="filterGallery('Events')">Events</button>
          <button class="btn btn-outline-primary" onclick="filterGallery('Students')">Students</button>
        </div>
      </div>
      <div class="row g-3" id="galleryGrid"></div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightboxImg" src="" alt="Preview">
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p class="mb-0">&copy; 2025 Shokat Ali Public School. All Rights Reserved.</p></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    let galleryData = [];
    document.addEventListener('DOMContentLoaded', function() {
      galleryData = JSON.parse(localStorage.getItem('gallery') || '[]');
      renderGallery(galleryData);
    });

    function renderGallery(items) {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = items.map(item => `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="gallery-item" onclick="openLightbox('${item.url}')">
            <img src="${item.url}" alt="${item.title}" loading="lazy">
            <div class="overlay"><i class="fas fa-search-plus"></i></div>
          </div>
          <p class="text-center small mt-1 text-muted">${item.title}</p>
        </div>
      `).join('');
    }

    function filterGallery(cat) {
      document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'all') renderGallery(galleryData);
      else renderGallery(galleryData.filter(i => i.category === cat));
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>
</body>
</html>
