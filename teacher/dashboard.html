<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background:var(--primary)">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-chalkboard-teacher me-2"></i>Teacher Portal</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container py-4">
    <h3 id="welcome" class="mb-4">Welcome</h3>
    <div class="row g-4">
      <div class="col-md-4"><a href="../admin/attendance.html" class="text-decoration-none"><div class="stat-card"><div class="icon-box green"><i class="fas fa-calendar-check"></i></div><div><h5>Attendance</h5><p>Mark daily attendance</p></div></div></a></div>
      <div class="col-md-4"><a href="../admin/exams.html" class="text-decoration-none"><div class="stat-card"><div class="icon-box blue"><i class="fas fa-file-alt"></i></div><div><h5>Results</h5><p>View student results</p></div></div></a></div>
      <div class="col-md-4"><a href="../admin/students.html" class="text-decoration-none"><div class="stat-card"><div class="icon-box orange"><i class="fas fa-users"></i></div><div><h5>Students</h5><p>View class students</p></div></div></a></div>
    </div>
    <div class="form-card mt-4">
      <h5>Latest Notices</h5>
      <div id="notices"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const session = checkAuth(['teacher']);
    if (!session) location.href = 'login.html';
    document.getElementById('welcome').textContent = 'Welcome, ' + session.name;
    const notices = JSON.parse(localStorage.getItem('notices') || '[]').filter(n => n.published);
    document.getElementById('notices').innerHTML = notices.map(n => `<p><strong>${n.title}</strong> - ${n.content}</p>`).join('') || 'No notices';
  </script>
</body>
</html>
