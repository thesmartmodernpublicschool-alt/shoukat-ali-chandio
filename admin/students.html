<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-graduation-cap fa-2x text-warning"></i>
        <h5 class="mt-2">Admin Panel</h5>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="students.html" class="active"><i class="fas fa-user-graduate"></i> Students</a></li>
        <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
        <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> Attendance</a></li>
        <li><a href="fees.html"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
        <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams & Results</a></li>
        <li><a href="timetable.html"><i class="fas fa-clock"></i> Timetable</a></li>
        <li><a href="notices.html"><i class="fas fa-bullhorn"></i> Notices</a></li>
        <li><a href="events.html"><i class="fas fa-calendar-day"></i> Events</a></li>
        <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>
    <div class="main-content">
      <div class="topbar">
        <span class="fw-bold">Student Management</span>
        <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
      <div class="content-area">
        <div class="table-card">
          <div class="card-header">
            <h5 class="mb-0">All Students</h5>
            <div class="d-flex gap-2">
              <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search..." style="width:180px" oninput="renderStudents()">
              <select class="form-select form-select-sm" id="filterClass" style="width:120px" onchange="renderStudents()">
                <option value="">All Classes</option>
                <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
              </select>
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openAddModal()"><i class="fas fa-plus"></i> Add</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>ID</th><th>Name</th><th>Father</th><th>Class</th><th>Section</th><th>Roll</th><th>Phone</th><th>Actions</th></tr></thead>
              <tbody id="studentsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Student</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="studentForm">
            <input type="hidden" id="editId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Name *</label><input type="text" class="form-control" id="sName" required></div>
              <div class="col-md-6"><label class="form-label">Father's Name *</label><input type="text" class="form-control" id="sFather" required></div>
              <div class="col-md-4"><label class="form-label">DOB</label><input type="date" class="form-control" id="sDob"></div>
              <div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" id="sGender"><option>Male</option><option>Female</option></select></div>
              <div class="col-md-4"><label class="form-label">Class *</label><select class="form-select" id="sClass" required><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></div>
              <div class="col-md-4"><label class="form-label">Section</label><input type="text" class="form-control" id="sSection" value="A"></div>
              <div class="col-md-4"><label class="form-label">Roll No</label><input type="text" class="form-control" id="sRoll"></div>
              <div class="col-md-4"><label class="form-label">Phone</label><input type="text" class="form-control" id="sPhone"></div>
              <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" id="sAddress" rows="2"></textarea></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveStudent()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!checkAuth(['admin'])) window.location.href = 'login.html';
    let students = [];
    let modal;

    document.addEventListener('DOMContentLoaded', () => {
      modal = new bootstrap.Modal(document.getElementById('studentModal'));
      students = JSON.parse(localStorage.getItem('students') || '[]');
      renderStudents();
    });

    function renderStudents() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cls = document.getElementById('filterClass').value;
      let filtered = students.filter(s => {
        const matchSearch = !search || s.name.toLowerCase().includes(search) || s.id.toLowerCase().includes(search) || (s.fatherName||'').toLowerCase().includes(search);
        const matchClass = !cls || s.class === cls;
        return matchSearch && matchClass;
      });
      document.getElementById('studentsTable').innerHTML = filtered.map(s => `
        <tr>
          <td>${s.id}</td><td>${s.name}</td><td>${s.fatherName||'-'}</td><td>${s.class}</td><td>${s.section||'-'}</td><td>${s.rollNo||'-'}</td><td>${s.phone||'-'}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="editStudent('${s.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${s.id}')"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="8" class="text-center text-muted">No students found</td></tr>';
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Student';
      document.getElementById('editId').value = '';
      document.getElementById('studentForm').reset();
    }

    function editStudent(id) {
      const s = students.find(x => x.id === id);
      if (!s) return;
      document.getElementById('modalTitle').textContent = 'Edit Student';
      document.getElementById('editId').value = s.id;
      document.getElementById('sName').value = s.name;
      document.getElementById('sFather').value = s.fatherName || '';
      document.getElementById('sDob').value = s.dob || '';
      document.getElementById('sGender').value = s.gender || 'Male';
      document.getElementById('sClass').value = s.class;
      document.getElementById('sSection').value = s.section || 'A';
      document.getElementById('sRoll').value = s.rollNo || '';
      document.getElementById('sPhone').value = s.phone || '';
      document.getElementById('sAddress').value = s.address || '';
      modal.show();
    }

    function saveStudent() {
      const editId = document.getElementById('editId').value;
      const data = {
        name: document.getElementById('sName').value.trim(),
        fatherName: document.getElementById('sFather').value.trim(),
        dob: document.getElementById('sDob').value,
        gender: document.getElementById('sGender').value,
        class: document.getElementById('sClass').value,
        section: document.getElementById('sSection').value,
        rollNo: document.getElementById('sRoll').value,
        phone: document.getElementById('sPhone').value,
        address: document.getElementById('sAddress').value
      };
      if (!data.name || !data.class) { showToast('Name and Class required', 'error'); return; }
      if (editId) {
        const idx = students.findIndex(s => s.id === editId);
        students[idx] = { ...students[idx], ...data };
        showToast('Student updated', 'success');
      } else {
        data.id = 'STU' + String(Date.now()).slice(-4);
        data.admissionDate = new Date().toISOString().split('T')[0];
        students.push(data);
        showToast('Student added', 'success');
      }
      localStorage.setItem('students', JSON.stringify(students));
      modal.hide();
      renderStudents();
    }

    function deleteStudent(id) {
      if (!confirmDelete()) return;
      students = students.filter(s => s.id !== id);
      localStorage.setItem('students', JSON.stringify(students));
      showToast('Student deleted', 'success');
      renderStudents();
    }
  </script>
</body>
</html>
