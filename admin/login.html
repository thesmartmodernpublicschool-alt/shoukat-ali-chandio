<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Shokat Ali Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">
        <i class="fas fa-graduation-cap fa-3x text-primary"></i>
        <h3>Admin Login</h3>
        <p class="subtitle">Shokat Ali Public School</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" name="username" placeholder="Enter username" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" name="password" placeholder="Enter password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-submit w-100">Login <i class="fas fa-sign-in-alt ms-1"></i></button>
      </form>
      <div class="alert alert-info mt-4 mb-0 small">
        <strong>Demo Credentials:</strong><br>
        Username: <code>admin</code><br>
        Password: <code>admin123</code>
      </div>
      <div class="text-center mt-3">
        <a href="../index.html" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Website</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    handleLoginForm('loginForm', 'admin', 'dashboard.html');
  </script>
</body>
</html>
