<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fas fa-graduation-cap fa-2x text-warning"></i><h5 class="mt-2">Admin Panel</h5></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
        <li><a href="teachers.html" class="active"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
        <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> Attendance</a></li>
        <li><a href="fees.html"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
        <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams & Results</a></li>
        <li><a href="timetable.html"><i class="fas fa-clock"></i> Timetable</a></li>
        <li><a href="notices.html"><i class="fas fa-bullhorn"></i> Notices</a></li>
        <li><a href="events.html"><i class="fas fa-calendar-day"></i> Events</a></li>
        <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>
    <div class="main-content">
      <div class="topbar"><span class="fw-bold">Teacher Management</span><button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
      <div class="content-area">
        <div class="table-card">
          <div class="card-header">
            <h5 class="mb-0">All Teachers</h5>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#teacherModal" onclick="openAdd()"><i class="fas fa-plus"></i> Add Teacher</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>ID</th><th>Name</th><th>Subject</th><th>Classes</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead>
              <tbody id="teachersTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="teacherModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="tModalTitle">Add Teacher</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="tEditId">
          <div class="mb-3"><label class="form-label">Name *</label><input type="text" class="form-control" id="tName" required></div>
          <div class="mb-3"><label class="form-label">Subject *</label><input type="text" class="form-control" id="tSubject" required></div>
          <div class="mb-3"><label class="form-label">Classes (e.g. 8,9,10)</label><input type="text" class="form-control" id="tClasses"></div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" id="tPhone"></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="tEmail"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveTeacher()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!checkAuth(['admin'])) location.href = 'login.html';
    let teachers = [], modal;
    document.addEventListener('DOMContentLoaded', () => {
      modal = new bootstrap.Modal(document.getElementById('teacherModal'));
      teachers = JSON.parse(localStorage.getItem('teachers') || '[]');
      render();
    });
    function render() {
      document.getElementById('teachersTable').innerHTML = teachers.map(t => `
        <tr>
          <td>${t.id}</td><td>${t.name}</td><td>${t.subject}</td><td>${t.classes||'-'}</td><td>${t.phone||'-'}</td><td>${t.email||'-'}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="editT('${t.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="delT('${t.id}')"><i class="fas fa-trash"></i></button>
          </td>
        </tr>`).join('') || '<tr><td colspan="7" class="text-center text-muted">No teachers</td></tr>';
    }
    function openAdd() { document.getElementById('tModalTitle').textContent = 'Add Teacher'; document.getElementById('tEditId').value = ''; document.getElementById('tName').value = ''; document.getElementById('tSubject').value = ''; document.getElementById('tClasses').value = ''; document.getElementById('tPhone').value = ''; document.getElementById('tEmail').value = ''; }
    function editT(id) {
      const t = teachers.find(x => x.id === id);
      document.getElementById('tModalTitle').textContent = 'Edit Teacher';
      document.getElementById('tEditId').value = t.id;
      document.getElementById('tName').value = t.name;
      document.getElementById('tSubject').value = t.subject;
      document.getElementById('tClasses').value = t.classes || '';
      document.getElementById('tPhone').value = t.phone || '';
      document.getElementById('tEmail').value = t.email || '';
      modal.show();
    }
    function saveTeacher() {
      const editId = document.getElementById('tEditId').value;
      const data = { name: document.getElementById('tName').value.trim(), subject: document.getElementById('tSubject').value.trim(), classes: document.getElementById('tClasses').value, phone: document.getElementById('tPhone').value, email: document.getElementById('tEmail').value };
      if (!data.name || !data.subject) { showToast('Name and Subject required', 'error'); return; }
      if (editId) { const i = teachers.findIndex(t => t.id === editId); teachers[i] = { ...teachers[i], ...data }; showToast('Updated', 'success'); }
      else { data.id = 'TCH' + String(Date.now()).slice(-4); data.joinDate = new Date().toISOString().split('T')[0]; teachers.push(data); showToast('Added', 'success'); }
      localStorage.setItem('teachers', JSON.stringify(teachers)); modal.hide(); render();
    }
    function delT(id) { if (!confirmDelete()) return; teachers = teachers.filter(t => t.id !== id); localStorage.setItem('teachers', JSON.stringify(teachers)); showToast('Deleted', 'success'); render(); }
  </script>
</body>
</html>
