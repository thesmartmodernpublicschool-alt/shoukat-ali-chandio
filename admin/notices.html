<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fas fa-graduation-cap fa-2x text-warning"></i><h5 class="mt-2">Admin Panel</h5></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
        <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
        <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> Attendance</a></li>
        <li><a href="fees.html"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
        <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams & Results</a></li>
        <li><a href="timetable.html"><i class="fas fa-clock"></i> Timetable</a></li>
        <li><a href="notices.html" class="active"><i class="fas fa-bullhorn"></i> Notices</a></li>
        <li><a href="events.html"><i class="fas fa-calendar-day"></i> Events</a></li>
        <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>
    <div class="main-content">
      <div class="topbar"><span class="fw-bold">Notices</span><button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
      <div class="content-area">
        <div class="form-card mb-4">
          <h5>Add Notice</h5>
          <div class="row g-3">
            <div class="col-md-5"><input type="text" class="form-control" id="nTitle" placeholder="Title"></div>
            <div class="col-md-5"><input type="text" class="form-control" id="nContent" placeholder="Content"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addNotice()">Add</button></div>
          </div>
        </div>
        <div class="table-card">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead><tr><th>Title</th><th>Date</th><th>Published</th><th>Action</th></tr></thead>
              <tbody id="noticesTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!checkAuth(['admin'])) location.href = 'login.html';
    let notices = JSON.parse(localStorage.getItem('notices') || '[]');
    function render() {
      document.getElementById('noticesTable').innerHTML = notices.map(n => `
        <tr>
          <td><strong>${n.title}</strong><br><small class="text-muted">${n.content.substring(0,60)}...</small></td>
          <td>${formatDate(n.date)}</td>
          <td>${n.published ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>'}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="delNotice(${n.id})"><i class="fas fa-trash"></i></button></td>
        </tr>`).join('') || '<tr><td colspan="4" class="text-center">No notices</td></tr>';
    }
    function addNotice() {
      const title = document.getElementById('nTitle').value.trim();
      const content = document.getElementById('nContent').value.trim();
      if (!title || !content) { showToast('Fill all fields', 'error'); return; }
      notices.push({ id: Date.now(), title, content, date: new Date().toISOString().split('T')[0], published: true });
      localStorage.setItem('notices', JSON.stringify(notices));
      document.getElementById('nTitle').value = ''; document.getElementById('nContent').value = '';
      showToast('Notice added', 'success'); render();
    }
    function delNotice(id) { if (!confirmDelete()) return; notices = notices.filter(n => n.id !== id); localStorage.setItem('notices', JSON.stringify(notices)); showToast('Deleted', 'success'); render(); }
    render();
  </script>
</body>
</html>
