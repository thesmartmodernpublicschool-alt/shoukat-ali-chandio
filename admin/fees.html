<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fees | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fas fa-graduation-cap fa-2x text-warning"></i><h5 class="mt-2">Admin Panel</h5></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
        <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
        <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> Attendance</a></li>
        <li><a href="fees.html" class="active"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
        <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams & Results</a></li>
        <li><a href="timetable.html"><i class="fas fa-clock"></i> Timetable</a></li>
        <li><a href="notices.html"><i class="fas fa-bullhorn"></i> Notices</a></li>
        <li><a href="events.html"><i class="fas fa-calendar-day"></i> Events</a></li>
        <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>
    <div class="main-content">
      <div class="topbar"><span class="fw-bold">Fees Management</span><button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
      <div class="content-area">
        <div class="table-card">
          <div class="card-header">
            <h5 class="mb-0">Fee Records</h5>
            <input type="text" class="form-control form-control-sm" id="feeSearch" placeholder="Search student..." style="width:200px" oninput="renderFees()">
          </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>ID</th><th>Student</th><th>Class</th><th>Month</th><th>Amount</th><th>Paid</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="feesTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!checkAuth(['admin'])) location.href = 'login.html';
    let fees = [];
    document.addEventListener('DOMContentLoaded', () => {
      fees = JSON.parse(localStorage.getItem('fees') || '[]');
      renderFees();
    });
    function renderFees() {
      const q = document.getElementById('feeSearch').value.toLowerCase();
      const filtered = fees.filter(f => !q || f.studentName.toLowerCase().includes(q) || f.id.toLowerCase().includes(q));
      document.getElementById('feesTable').innerHTML = filtered.map(f => `
        <tr>
          <td>${f.id}</td><td>${f.studentName}</td><td>${f.class}</td><td>${f.month}</td>
          <td>${f.amount}</td><td>${f.paid}</td>
          <td><span class="badge ${f.status==='Paid'?'bg-success':f.status==='Partial'?'bg-warning':'bg-danger'}">${f.status}</span></td>
          <td>${f.status!=='Paid' ? `<button class="btn btn-sm btn-success" onclick="markPaid('${f.id}')">Mark Paid</button>` : '-'}</td>
        </tr>`).join('') || '<tr><td colspan="8" class="text-center text-muted">No records</td></tr>';
    }
    function markPaid(id) {
      const f = fees.find(x => x.id === id);
      if (f) { f.paid = f.amount; f.status = 'Paid'; f.date = new Date().toISOString().split('T')[0]; localStorage.setItem('fees', JSON.stringify(fees)); showToast('Payment recorded', 'success'); renderFees(); }
    }
  </script>
</body>
</html>
