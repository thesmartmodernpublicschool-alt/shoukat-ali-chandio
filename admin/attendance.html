<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fas fa-graduation-cap fa-2x text-warning"></i><h5 class="mt-2">Admin Panel</h5></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
        <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
        <li><a href="attendance.html" class="active"><i class="fas fa-calendar-check"></i> Attendance</a></li>
        <li><a href="fees.html"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
        <li><a href="exams.html"><i class="fas fa-file-alt"></i> Exams & Results</a></li>
        <li><a href="timetable.html"><i class="fas fa-clock"></i> Timetable</a></li>
        <li><a href="notices.html"><i class="fas fa-bullhorn"></i> Notices</a></li>
        <li><a href="events.html"><i class="fas fa-calendar-day"></i> Events</a></li>
        <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>
    <div class="main-content">
      <div class="topbar"><span class="fw-bold">Attendance Management</span><button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
      <div class="content-area">
        <div class="form-card mb-4">
          <div class="row g-3 align-items-end">
            <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" id="attDate"></div>
            <div class="col-md-3"><label class="form-label">Class</label>
              <select class="form-select" id="attClass"><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option><option value="9">9</option><option value="10">10</option></select>
            </div>
            <div class="col-md-3"><button class="btn btn-primary" onclick="loadStudents()"><i class="fas fa-search"></i> Load Students</button></div>
          </div>
        </div>
        <div class="table-card">
          <div class="card-header"><h5 class="mb-0">Mark Attendance</h5><button class="btn btn-success btn-sm" onclick="saveAttendance()">Save Attendance</button></div>
          <div class="table-responsive">
            <table class="table mb-0">
              <thead><tr><th>Student ID</th><th>Name</th><th>Status</th></tr></thead>
              <tbody id="attTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!checkAuth(['admin','teacher'])) location.href = 'login.html';
    document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
    function loadStudents() {
      const cls = document.getElementById('attClass').value;
      const students = JSON.parse(localStorage.getItem('students') || '[]').filter(s => s.class === cls);
      document.getElementById('attTable').innerHTML = students.map(s => `
        <tr>
          <td>${s.id}</td><td>${s.name}</td>
          <td>
            <select class="form-select form-select-sm att-status" data-id="${s.id}">
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
              <option value="Leave">Leave</option>
            </select>
          </td>
        </tr>`).join('') || '<tr><td colspan="3" class="text-center">No students in this class</td></tr>';
    }
    function saveAttendance() {
      const date = document.getElementById('attDate').value;
      const cls = document.getElementById('attClass').value;
      const records = {};
      document.querySelectorAll('.att-status').forEach(sel => { records[sel.dataset.id] = sel.value; });
      let attendance = JSON.parse(localStorage.getItem('attendance') || '[]');
      const idx = attendance.findIndex(a => a.date === date && a.class === cls);
      if (idx >= 0) attendance[idx].records = records;
      else attendance.push({ date, class: cls, records });
      localStorage.setItem('attendance', JSON.stringify(attendance));
      showToast('Attendance saved successfully', 'success');
    }
    loadStudents();
  </script>
</body>
</html>
