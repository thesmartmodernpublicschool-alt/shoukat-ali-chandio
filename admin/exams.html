<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exams & Results | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header"><i class="fas fa-graduation-cap fa-2x text-warning"></i><h5 class="mt-2">Admin Panel</h5></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="students.html"><i class="fas fa-user-graduate"></i> Students</a></li>
        <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
        <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> Attendance</a></li>
        <li><a href="fees.html"><i class="fas fa-money-bill-wave"></i> Fees</a></li>
        <li><a href="exams.html" class="active"><i class="fas fa-file-alt"></i> Exams & Results</a></li>
        <li><a href="timetable.html"><i class="fas fa-clock"></i> Timetable</a></li>
        <li><a href="notices.html"><i class="fas fa-bullhorn"></i> Notices</a></li>
        <li><a href="events.html"><i class="fas fa-calendar-day"></i> Events</a></li>
        <li><a href="gallery.html"><i class="fas fa-images"></i> Gallery</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>
    <div class="main-content">
      <div class="topbar"><span class="fw-bold">Exams & Results</span><button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
      <div class="content-area">
        <div class="table-card mb-4">
          <div class="card-header"><h5 class="mb-0">Student Results</h5></div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>Student ID</th><th>Exam</th><th>Total</th><th>Percentage</th><th>Grade</th><th>Action</th></tr></thead>
              <tbody id="resultsTable"></tbody>
            </table>
          </div>
        </div>
        <div id="resultCard" class="form-card d-none">
          <h4 class="mb-3">Result Card</h4>
          <div id="resultContent"></div>
          <button class="btn btn-primary mt-3" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!checkAuth(['admin','teacher'])) location.href = 'login.html';
    const results = JSON.parse(localStorage.getItem('results') || '[]');
    const students = JSON.parse(localStorage.getItem('students') || '[]');
    function getGrade(p) { if (p>=90) return 'A+'; if (p>=80) return 'A'; if (p>=70) return 'B'; if (p>=60) return 'C'; if (p>=50) return 'D'; return 'F'; }
    document.getElementById('resultsTable').innerHTML = results.map(r => {
      const total = r.subjects.reduce((s,x) => s + x.marks, 0);
      const max = r.subjects.reduce((s,x) => s + x.total, 0);
      const pct = ((total/max)*100).toFixed(1);
      return `<tr>
        <td>${r.studentId}</td><td>${r.exam}</td><td>${total}/${max}</td><td>${pct}%</td><td>${getGrade(pct)}</td>
        <td><button class="btn btn-sm btn-outline-primary" onclick="showCard('${r.studentId}')">View Card</button></td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" class="text-center text-muted">No results yet</td></tr>';
    function showCard(sid) {
      const r = results.find(x => x.studentId === sid);
      const stu = students.find(s => s.id === sid) || { name: sid };
      const total = r.subjects.reduce((s,x) => s + x.marks, 0);
      const max = r.subjects.reduce((s,x) => s + x.total, 0);
      const pct = ((total/max)*100).toFixed(1);
      document.getElementById('resultContent').innerHTML = `
        <p><strong>Student:</strong> ${stu.name} (${sid})</p>
        <p><strong>Exam:</strong> ${r.exam}</p>
        <table class="table table-bordered"><thead><tr><th>Subject</th><th>Marks</th><th>Total</th></tr></thead>
        <tbody>${r.subjects.map(s => `<tr><td>${s.name}</td><td>${s.marks}</td><td>${s.total}</td></tr>`).join('')}</tbody>
        <tfoot><tr><th>Total</th><th>${total}</th><th>${max}</th></tr></tfoot></table>
        <p><strong>Percentage:</strong> ${pct}% | <strong>Grade:</strong> ${getGrade(pct)}</p>`;
      document.getElementById('resultCard').classList.remove('d-none');
    }
  </script>
</body>
</html>
