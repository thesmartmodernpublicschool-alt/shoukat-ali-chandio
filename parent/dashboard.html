<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background:var(--primary)">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-users me-2"></i>Parent Portal</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="container py-4">
    <h3 id="welcome" class="mb-4">Welcome</h3>
    <div class="row g-4">
      <div class="col-md-3"><div class="stat-card"><div class="icon-box blue"><i class="fas fa-user-graduate"></i></div><div><h5 id="childName">-</h5><p>Child Profile</p></div></div></div>
      <div class="col-md-3"><div class="stat-card"><div class="icon-box green"><i class="fas fa-calendar-check"></i></div><div><h5>View</h5><p>Attendance</p></div></div></div>
      <div class="col-md-3"><div class="stat-card"><div class="icon-box orange"><i class="fas fa-money-bill"></i></div><div><h5 id="feeStatus">-</h5><p>Fees</p></div></div></div>
      <div class="col-md-3"><div class="stat-card"><div class="icon-box purple"><i class="fas fa-file-alt"></i></div><div><h5>View</h5><p>Results</p></div></div></div>
    </div>
    <div class="form-card mt-4">
      <h5>Child Information</h5>
      <div id="childInfo"></div>
    </div>
    <div class="form-card mt-4">
      <h5>Fee Status</h5>
      <div id="feeInfo"></div>
    </div>
    <div class="form-card mt-4">
      <h5>Notices</h5>
      <div id="notices"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const session = checkAuth(['parent']);
    if (!session) location.href = 'login.html';
    document.getElementById('welcome').textContent = 'Welcome, ' + session.name;
    const students = JSON.parse(localStorage.getItem('students') || '[]');
    const stu = students.find(s => s.id === session.studentId) || {};
    document.getElementById('childName').textContent = stu.name || '-';
    document.getElementById('childInfo').innerHTML = `<p><strong>Name:</strong> ${stu.name} | <strong>Class:</strong> ${stu.class} | <strong>Roll:</strong> ${stu.rollNo}</p>`;
    const fees = JSON.parse(localStorage.getItem('fees') || '[]').filter(f => f.studentId === session.studentId);
    document.getElementById('feeInfo').innerHTML = fees.map(f => `<p>${f.month}: <span class="badge ${f.status==='Paid'?'bg-success':'bg-danger'}">${f.status}</span> (Paid: ${f.paid}/${f.amount})</p>`).join('') || 'No fee records';
    document.getElementById('feeStatus').textContent = fees.length ? fees[0].status : '-';
    const notices = JSON.parse(localStorage.getItem('notices') || '[]').filter(n => n.published);
    document.getElementById('notices').innerHTML = notices.map(n => `<p><strong>${n.title}</strong> - ${n.content}</p>`).join('') || 'No notices';
  </script>
</body>
</html>
